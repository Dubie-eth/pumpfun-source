name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: linux-bootstrap-host-libraries
            commands: |
              python -B reconstruction/toolchain/test_bootstrap_linux.py
              python -B tests/test_linux_hybrid_publication.py
              python -B reconstruction/toolchain/test_bootstrap_macos.py
          - suite: byte-comparison-input-preservation
            commands: |
              sudo apt-get update
              sudo apt-get install -y llvm
              python -B reconstruction/tooling/byte-comparison-input-preservation/test_verify.py --objdump /usr/bin/llvm-objdump
              PUMP_OBJDUMP=/usr/bin/llvm-objdump python -I -B reconstruction/pump-main/lanes/multihop-reconstruction/test_rdiff.py
          - suite: contract-tests
            commands: |
              python -B -m unittest discover -s tests -v
          - suite: fees-exact-source-staging
            commands: |
              python -B research/fees-exact-readme-stage-20261030/test_stage.py
              python -B research/fees-exact-readme-stage-20261030/replay.py --repo . --output work/fees-exact-source-staging
          - suite: fees-linux-rebuild-packet
            commands: |
              python -B research/fees-linux-fresh-rebuild-20261030/test_verify.py
              python -B -O research/fees-linux-fresh-rebuild-20261030/test_verify.py
          - suite: swap-hop-residual-packet
            commands: |
              python -B research/swap-hop-residual-20261030/test_verify.py
              python -B -O research/swap-hop-residual-20261030/test_verify.py
          - suite: analysis-packet-encoding
            commands: |
              python -B research/tooling-analysis-encoding-20261030/test_verify.py
              python -B research/tooling-analysis-output-retention-20261029/test_generate.py
              python -B reconstruction/tooling/roadmap-manifest-members/test_verify.py
              python -B reconstruction/tooling/deep-analysis-output-links/test_verify.py
          - suite: amm-multi-hop-packets
            commands: |
              python -B research/amm-multi-hop-images/test_packets.py
          - suite: fastbuild-staging
            commands: |
              python -I -B tests/test_fastbuild_stage.py
              python -B reconstruction/harness/test_fastbuild_output_race.py
              python -B reconstruction/harness/test_build_publication_boundaries.py
              python -B reconstruction/harness/test_fastbuild_library_name.py
              python -B reconstruction/harness/test_physical_source_wrapper.py
          - suite: admin-cto-call-report
            commands: |
              python -B reconstruction/pump-main/lanes/w12b13-cto-callgraph/test_callseq.py
          - suite: admin-cto-stack-coloring
            commands: |
              python -B reconstruction/pump-main/lanes/w12b12-cto-cpi/test_scmerge.py
          - suite: admin-cto-bfi
            commands: |
              python -B reconstruction/pump-main/lanes/w12a10-cto-optoracle/test_bfi.py
          - suite: admin-frame-diagnostics
            commands: |
              python -B reconstruction/pump-main/lanes/w12a02-cto-iroracle/test_diagnostics.py
          - suite: composition-patch-bytes
            commands: |
              python -B reconstruction/harness/test_integrate_failures.py
              python -B reconstruction/harness/test_integrate_no_build_cli.py
              python -B reconstruction/harness/test_integrate_build_input_recheck.py
              python -B reconstruction/harness/test_composition_boundaries.py
              python -B reconstruction/harness/test_build_pair_boundaries.py
              python -B reconstruction/harness/test_build_pair_source_overlap.py
              python -B reconstruction/harness/test_composition_deadline.py
              python -B reconstruction/harness/test_fastbuild_stack.py
              python -B reconstruction/harness/test_integrate_empty_files.py
              python -B reconstruction/harness/test_integrate_binary_files.py
              python -B reconstruction/harness/test_integrate_file_directory.py
              python -B reconstruction/harness/test_integrate_source_links.py
              python -B reconstruction/harness/test_integrate_orig_sources.py
              python -I -B tests/test_integrate_patch_bytes.py
              python -I -B reconstruction/harness/test_treediff_links.py
          - suite: offline-cargo-cache
            commands: |
              python -I -B scripts/test_prepare_locked_cargo_home.py
          - suite: evidence
            commands: |
              python -B research/tooling-relocated-data-pointers-20261030/test_pointer_analysis.py
              python scripts/verify_evidence.py
              python -B scripts/test_verify_context_slot_bounds.py
